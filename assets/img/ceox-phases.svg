<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 450" width="1420" height="450" font-family="'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8A6A1"/></marker></defs>
  <rect width="1420" height="450" fill="#FFFFFF"/>
  <g font-size="21" font-weight="700" fill="#E26942" text-anchor="middle" letter-spacing="1.5">
    <text x="270" y="34">SET THE FOUNDATION</text>
    <text x="900" y="34">BUILD THE BUSINESS TO DELIVER IT</text>
  </g>
  <g font-size="16" fill="#4E4D4F" text-anchor="middle">
    <text x="270" y="58">brand, customers, the promise · done once</text>
    <text x="900" y="58">the organization, from plan to touchpoint · every cycle</text>
  </g>
  <g stroke="#A8A6A1" stroke-width="2" fill="none">
    <path d="M70,72 V82 H470 V72"/>
    <path d="M540,72 V82 H1300 V72"/>
  </g>
  <g transform="translate(0,35)">
    <g stroke="#38383B" stroke-width="4" fill="none" stroke-linejoin="round">
      <path d="M150,210 H990"/>
      <path d="M990,210 L1040,160 H1240 L1290,210"/>
      <path d="M990,210 L1040,260 H1240 L1290,210"/>
    </g>
    <!-- annual loop back to Chart -->
    <path d="M1290,210 H1340 V375 H630 V338" fill="none" stroke="#A8A6A1" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#ah)"/>
    <text x="985" y="397" text-anchor="middle" font-size="16" fill="#4E4D4F">each year, the cycle returns to Chart</text>
    <g font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">
      <circle cx="150" cy="210" r="22" fill="#E26942"/><text x="150" y="218">1</text>
      <circle cx="390" cy="210" r="22" fill="#E26942"/><text x="390" y="218">2</text>
      <circle cx="630" cy="210" r="22" fill="#38383B"/><text x="630" y="218">3</text>
      <circle cx="870" cy="210" r="22" fill="#38383B"/><text x="870" y="218">4</text>
      <circle cx="1140" cy="160" r="22" fill="#38383B"/><text x="1140" y="168">5</text>
      <circle cx="1140" cy="260" r="22" fill="#A8A6A1"/><text x="1140" y="268">6</text>
    </g>
    <g text-anchor="middle">
      <g font-size="25" font-weight="700" fill="#38383B">
        <text x="150" y="275">Orient</text><text x="390" y="275">Architect</text><text x="630" y="275">Chart</text><text x="870" y="275">Mobilize</text>
      </g>
      <g font-size="17" fill="#4E4D4F">
        <text x="150" y="302">Where you are,</text><text x="150" y="324">where you want to go</text>
        <text x="390" y="302">The manifestos</text><text x="390" y="324">and the promise</text>
        <text x="630" y="302">The plan,</text><text x="630" y="324">locked in</text>
        <text x="870" y="302">The roadshow</text><text x="870" y="324">to the whole company</text>
      </g>
      <text x="1140" y="94" font-size="25" font-weight="700" fill="#38383B">Connect</text>
      <text x="1140" y="119" font-size="17" fill="#4E4D4F">Every touchpoint</text>
      <text x="1140" y="315" font-size="25" font-weight="700" fill="#38383B">Evolve</text>
      <text x="1140" y="339" font-size="17" fill="#4E4D4F">Keep it holding</text>
    </g>
  </g>
</svg>
