<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 150 700 630" width="1000" height="650" font-family="'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8A6A1"/>
    </marker>
  </defs>
  <rect y="140" width="1000" height="650" fill="#FFFFFF"/>
  <!-- triangle body -->
  <path d="M300,250 L500,560 L700,250 Z" fill="#DFE0E1" fill-opacity="0.45" stroke="none"/>
  <!-- sides -->
  <path d="M300,250 L500,560 L700,250" fill="none" stroke="#38383B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- top edge: the promise, broken by its label -->
  <line x1="300" y1="250" x2="410" y2="250" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
  <line x1="590" y1="250" x2="700" y2="250" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
  <text x="500" y="259" text-anchor="middle" font-size="28" font-weight="700" fill="#C0392B">Promise</text>
  <!-- delivery arrows -->
  <line x1="442" y1="553" x2="302" y2="336" stroke="#A8A6A1" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="558" y1="553" x2="698" y2="336" stroke="#A8A6A1" stroke-width="3" marker-end="url(#ah)"/>
  <!-- vertices -->
  <circle cx="300" cy="250" r="9" fill="#38383B"/>
  <circle cx="700" cy="250" r="9" fill="#38383B"/>
  <circle cx="500" cy="560" r="9" fill="#38383B"/>
  <!-- labels -->
  <text x="300" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#38383B">Brand</text>
  <text x="300" y="220" text-anchor="middle" font-size="19" fill="#4E4D4F">with depth and meaning</text>
  <text x="700" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#38383B">Customers</text>
  <text x="700" y="220" text-anchor="middle" font-size="19" fill="#4E4D4F">the right ones, understood</text>
  <text x="500" y="612" text-anchor="middle" font-size="30" font-weight="700" fill="#38383B">Organization</text>
  <text x="500" y="642" text-anchor="middle" font-size="19" fill="#4E4D4F">built to keep the promise</text>
  <!-- caption -->
  <text x="500" y="725" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2" fill="#C0392B">THE PROMISE TRIFECTA</text>
  <text x="500" y="760" text-anchor="middle" font-size="22" fill="#38383B">The promise sets you apart. The organization is built to keep it.</text>
</svg>
